[package]
name = "cyber-giveaway"
version = "0.0.7"
edition = "2021"
description = "Twitch-Giveaway-Tool mit OBS-Overlay und simuliertem Matrix-Run im Shadowrun-Stil"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "CyberGiveaway"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_extras = { version = "0.31", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
ureq = { version = "2.10", features = ["json"] }
rand = "0.8"
chrono = "0.4"
rfd = "0.15"
regex = "1"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
