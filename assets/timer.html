<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix-Run Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0b26; --line:#3a3170;
  --decker:#2ee6c5; --host:#ff3fa4; --gold:#ffd166; --text:#e8e3ff; --muted:#9a93c9;
  --accent:var(--decker);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);
  font:500 16px/1.2 "Chakra Petch","Bahnschrift","Segoe UI",sans-serif}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6px;
  transition:opacity .4s ease;opacity:1}
body[data-show="0"] .wrap{opacity:0}
.chip{width:min(100%,560px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 14px;
  padding:12px 16px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;
  background:linear-gradient(160deg,rgba(22,18,56,.93),rgba(14,11,38,.9));position:relative}
.chip::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
  background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(165,139,255,.05) 30px 31px)}
svg{width:36px;height:40px;grid-row:1/3}
svg polygon{fill:rgba(14,11,38,.95);stroke:var(--accent);stroke-width:3}
svg text{fill:var(--accent);font:700 15px "Chakra Petch",sans-serif}
.label{font-size:clamp(13px,3.2vw,16px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label kbd{font:inherit;font-weight:700;color:var(--ink);background:var(--accent);padding:0 6px;border-radius:2px}
.value{grid-row:1/3;grid-column:3;font-size:clamp(28px,8vw,44px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.bar{grid-column:2;margin-top:8px;height:8px;display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.bar i{background:#251f52}
.bar i.on{background:var(--accent)}
body[data-state="open"]{--accent:var(--decker)}
body[data-state="run"]{--accent:var(--host)}
body[data-state="run"] .bar i{animation:scan 1.2s linear infinite}
body[data-state="winner"]{--accent:var(--gold)}
body[data-state="winner"] .value{color:var(--gold)}
body[data-state="wait"] .value{color:var(--text)}
.urgent .value{color:var(--host)}
@keyframes scan{0%,100%{background:#251f52}50%{background:var(--host)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-show="0" data-state="wait">
<div class="wrap">
  <div id="chip" class="chip" role="status" aria-live="polite">
    <svg viewBox="0 0 36 40" aria-hidden="true"><polygon points="18,2 34,11 34,29 18,38 2,29 2,11"/><text id="glyph" x="18" y="25" text-anchor="middle">W6</text></svg>
    <div id="label" class="label"></div>
    <div id="value" class="value"></div>
    <div id="bar" class="bar"></div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=new URLSearchParams(location.search);
const demo=q.get('demo')==='1';
let view={show:false}, endAt=0, total=0;

const clock=s=>{s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
function bar(frac){let h='';const on=Math.round(Math.max(0,Math.min(1,frac))*30);for(let i=0;i<30;i++)h+=`<i class="${i<on?'on':''}" style="animation-delay:${i*40}ms"></i>`;$('bar').innerHTML=h;}

// Zustand des Tools → Anzeige
function fromState(st){
  const a=st.auto||{enabled:false,state:'aus'};
  if(st.mode==='open'){
    return {show:true,state:'open',label:`Zugang offen – schreibe <kbd>${esc(st.keyword||'!join')}</kbd>`,glyph:'!',
      remaining:st.timer_active?st.timer_remaining:null,total:st.timer_total};
  }
  if(st.mode==='run')return {show:true,state:'run',label:'Matrix-Run läuft',glyph:'IC',value:'BREACH'};
  if(st.mode==='winner')return {show:true,state:'winner',label:'Gewinner',glyph:'★',value:'@'+(st.winner||'')};
  if(a.enabled&&a.state==='wartet')return {show:true,state:'wait',label:'Nächstes Giveaway in',glyph:'W6',remaining:a.remaining,total:a.total};
  return {show:false};
}
function apply(v){
  view=v;document.body.dataset.show=v.show?'1':'0';
  if(!v.show)return;
  document.body.dataset.state=v.state;
  $('label').innerHTML=v.label;$('glyph').textContent=v.glyph;
  if(v.remaining!=null){endAt=performance.now()+v.remaining*1000;total=v.total||0;}
  else{endAt=0;$('value').textContent=v.value??'Manuell';}
  if(v.state==='run')bar(1);
  if(v.state==='winner')bar(1);
  if(v.remaining==null&&v.state==='open')bar(1);
  tick();
}
function tick(){
  if(!view.show||!endAt)return;
  const rem=(endAt-performance.now())/1000;
  $('value').textContent=clock(rem);
  $('chip').classList.toggle('urgent',view.state==='open'&&rem<=10);
  // Warten: Leiste füllt sich bis zum Start. Offen: Leiste läuft leer.
  if(total>0)bar(view.state==='wait'?1-rem/total:rem/total);
}
setInterval(tick,250);

let retry=500;
function connect(){
  const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{retry=500;};
  ws.onmessage=e=>{try{apply(fromState(JSON.parse(e.data)))}catch(err){console.error(err)}};
  ws.onclose=()=>{apply({show:false});setTimeout(connect,retry);retry=Math.min(10000,retry*1.7);};
}
async function runDemo(){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  for(;;){
    apply(fromState({mode:'idle',auto:{enabled:true,state:'wartet',remaining:12,total:12}}));await wait(12000);
    apply(fromState({mode:'open',keyword:'!hack',timer_active:true,timer_remaining:12,timer_total:12}));await wait(12000);
    apply(fromState({mode:'run'}));await wait(6000);
    apply(fromState({mode:'winner',winner:'chromefox'}));await wait(5000);
  }
}
if(demo)runDemo();else connect();
</script>
</body>
</html>
