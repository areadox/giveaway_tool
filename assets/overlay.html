<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix-Run Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="tfont" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Grundwerte = Design „Shadowrun“. Jedes Design überschreibt sie in seiner theme.css. */
:root{
  --ink:#0e0b26; --ink2:#161238; --line:#3a3170;
  --decker:#2ee6c5; --host:#ff3fa4; --glitch:#ff5a36; --edge:#a58bff; --gold:#ffd166;
  --text:#e8e3ff; --muted:#9a93c9;
  --font:"Chakra Petch","Bahnschrift","Segoe UI",sans-serif;
  --font-head:var(--font);
  --panel-bg:linear-gradient(160deg,rgba(22,18,56,.93),rgba(14,11,38,.9));
  --panel-border:1px solid var(--line);
  --panel-radius:4px;
  --panel-shadow:none;
  --panel-pattern:repeating-linear-gradient(90deg,transparent 0 46px,rgba(165,139,255,.05) 46px 47px),
                  repeating-linear-gradient(0deg,transparent 0 46px,rgba(165,139,255,.05) 46px 47px);
  --winner-bg:rgba(14,11,38,.97);
  --die-bg:#efeaff; --die-pip:#2a2450; --die-radius:6px;
  --track:#251f52; --box-line:#6b62a8;
  --node-fill:rgba(14,11,38,.95); --node-locked:#4a437f; --node-label-locked:#6b62a8;
  --tag-radius:2px;
  --portrait-overlay:repeating-linear-gradient(0deg,rgba(14,11,38,.18) 0 2px,transparent 2px 4px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);
  font:500 16px/1.35 var(--font)}
h1,h2,.hostname,.winner strong,.verdict .v,.announce,.clock{font-family:var(--font-head)}
.stage{position:fixed;inset:0;padding:clamp(10px,1.6vw,28px);display:flex;align-items:center;justify-content:center;
  transition:opacity .4s ease;opacity:1}
body[data-visible="0"] .stage{opacity:0}
.panel{background:var(--panel-bg);border:var(--panel-border);box-shadow:var(--panel-shadow);
  border-radius:var(--panel-radius);position:relative;min-width:0;min-height:0}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--panel-radius);
  background:var(--panel-pattern)}

/* ---------- Run-Layout ---------- */
.run{width:min(1600px,100%);height:min(900px,100%);display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:0;padding:18px 22px}
.hosthead{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.hostname{font-size:clamp(20px,1.9vw,30px);font-weight:700;color:var(--host);letter-spacing:.01em}
.hostmeta{color:var(--muted);font-size:clamp(12px,1vw,15px)}
.asdf{display:flex;gap:6px;margin-left:auto}
.asdf span{border:1px solid var(--line);padding:2px 8px;font-size:13px;color:var(--text)}
.asdf b{color:var(--host);font-weight:600;margin-right:4px}
.phase{font-size:clamp(14px,1.25vw,19px);margin-top:8px;color:var(--text)}
.phase em{font-style:normal;color:var(--decker);font-weight:600;margin-right:10px}
.graphwrap{position:relative;min-height:0}
canvas{width:100%;height:100%;display:block}

/* Würfelschale */
.tray{border-top:1px solid var(--line);padding-top:12px;min-height:200px}
.action{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.action h2{margin:0;font-size:clamp(18px,1.6vw,26px);font-weight:700}
.actor{font-size:13px;padding:1px 8px;border-radius:var(--tag-radius);background:var(--decker);color:var(--ink);font-weight:700}
.actor.host,.actor.ice{background:var(--host)}
.pool{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;align-items:center;gap:14px;margin:6px 0}
.pool .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.pool .lbl strong{display:block;color:var(--text);font-size:14px;font-weight:600}
.dice{display:flex;flex-wrap:wrap;gap:6px}
.hits{font-size:clamp(18px,1.5vw,24px);font-weight:700;min-width:96px;text-align:right}
.hits small{font-size:12px;font-weight:500;color:var(--muted);display:block}
.die{width:32px;height:32px;border-radius:var(--die-radius);background:var(--die-bg);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.die i{width:6px;height:6px;border-radius:50%;background:var(--die-pip);place-self:center;visibility:hidden}
.die.hit{background:var(--decker);box-shadow:0 0 12px var(--decker-a60),inset 0 -3px 0 rgba(0,0,0,.2)}
.die.one{background:var(--glitch)}
.die.one i{background:#fff}
.die.miss{opacity:.55}
.dice.host .die.hit{background:var(--host);box-shadow:0 0 12px var(--host-a60),inset 0 -3px 0 rgba(0,0,0,.2)}
.dice.rolling .die{animation:tumble .12s linear infinite}
@keyframes tumble{50%{transform:rotate(14deg) translateY(-2px)}}
.verdict{display:flex;align-items:center;gap:12px;margin-top:10px}
.verdict .v{font-size:clamp(20px,1.9vw,30px);font-weight:700;letter-spacing:.04em;color:var(--decker)}
.verdict .v.fail{color:var(--host)}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:var(--tag-radius)}
.tag.glitch{background:var(--glitch);color:#fff}
.tag.edge{background:var(--edge);color:var(--ink)}
.cands{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.cand{padding:6px 12px;border:1px solid var(--line);border-radius:var(--tag-radius);font-size:16px;transition:opacity .35s,color .35s}
.cand.raus{opacity:.25;text-decoration:line-through}
.cand.gewinner{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px var(--gold-a40)}
.traynote{color:var(--muted);font-size:15px}
.announce{font-size:clamp(26px,2.6vw,42px);font-weight:700;padding-top:18px;color:var(--text)}
.announce.threat{color:var(--host);animation:alarm 1s steps(2) 3}

/* Charakterbogen */
.sheet{padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who strong{font-size:20px;color:var(--decker)}
.who span{font-size:13px;color:var(--muted);text-align:right}
.row h3{margin:0 0 5px;font-size:14px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.row h3 b{color:var(--text);font-weight:600}
.os{height:12px;display:grid;grid-template-columns:repeat(40,1fr);gap:2px}
.os i{background:var(--track)}
.os i.on{background:var(--gold)}
.os.hot i.on{background:var(--glitch)}
.os.hot{animation:alarm 1s steps(2) infinite}
@keyframes alarm{50%{filter:brightness(1.6)}}
.boxes{display:flex;flex-wrap:wrap;gap:3px}
.boxes i{width:17px;height:17px;border:1px solid var(--box-line);border-radius:calc(var(--tag-radius)/2);position:relative}
.boxes i.x::after{content:"";position:absolute;inset:2px;background:linear-gradient(45deg,transparent 42%,var(--host) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--host) 42% 58%,transparent 58%)}
.marks,.edgepts{display:flex;gap:6px}
.marks i{width:16px;height:16px;transform:rotate(45deg);border:2px solid var(--decker)}
.marks i.on{background:var(--decker)}
.edgepts i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge)}
.edgepts i.on{background:var(--edge)}
.twin{display:flex;gap:18px}
.alert{font-weight:700;font-size:14px;color:var(--muted)}
.alert.passive{color:var(--gold)}
.alert.active{color:var(--glitch)}
.ice{display:flex;flex-direction:column;gap:4px}
.ice div{display:flex;justify-content:space-between;font-size:14px;padding:3px 8px;border-left:3px solid var(--host);background:var(--host-a8)}
.ice div.down{border-color:var(--node-locked);background:none;color:var(--muted);text-decoration:line-through}
.log{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border-top:1px solid var(--line);padding-top:8px;
  mask-image:linear-gradient(to bottom,transparent,#000 22%)}
.log p{margin:0;font-size:13px;line-height:1.3;color:var(--muted)}
.log p.good{color:var(--good-text)}.log p.bad{color:var(--bad-text)}.log p.warn{color:var(--gold)}.log p.edge{color:var(--edge)}.log p:last-child{color:var(--text)}


/* ---------- Spiel-Abläufe (EVE, Palia, WoW, Anime) ---------- */
.gstage{position:relative;min-height:0;overflow:hidden}
.gstage canvas{position:absolute;inset:0;width:100%;height:100%}
#gcanvas{z-index:0}#gdom{position:absolute;inset:0;z-index:1}#gfx{z-index:2;pointer-events:none}
.gtray{border-top:1px solid var(--line);padding-top:8px;min-height:64px}
.gtray .announce{padding-top:4px;font-size:clamp(20px,1.9vw,32px)}
.announce.gin{animation:gin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes gin{from{opacity:0;transform:translateY(14px)}}
.gstat{display:flex;flex-direction:column;gap:12px}
.bar{height:12px;background:var(--track);border-radius:calc(var(--tag-radius)/2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--decker);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:60px 100%;background-repeat:no-repeat;animation:sheen 2.4s linear infinite}
@keyframes sheen{from{background-position:-60px 0}to{background-position:calc(100% + 60px) 0}}
.bar.host i{background:var(--host)}
.bar.gold i{background:var(--gold)}
.bar.heat i{background:linear-gradient(90deg,#5aa9e6,#f2c14e,#e2553a);width:100%!important}
.bar.heat b{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--text);border-radius:2px;transition:left .8s cubic-bezier(.2,1.3,.4,1);box-shadow:0 0 8px var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);padding:2px 8px;border-radius:var(--tag-radius);font-size:13px;transition:all .4s}
.chips span.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px var(--gold-a25)}
.chips span.off{opacity:.35}
.statline{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.statline b{color:var(--text);font-size:16px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots span{border:1px dashed var(--line);border-radius:var(--tag-radius);font-size:12px;padding:5px 6px;text-align:center;color:var(--muted);min-height:30px}
.slots span.on{border-style:solid;border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px var(--gold-a25);animation:gin .4s}
/* Teilnehmerliste je Ablauf */
.gcands{display:flex;flex-wrap:wrap;gap:8px;perspective:600px}
.gc{padding:6px 12px;border:1px solid var(--line);border-radius:var(--tag-radius);font-size:16px;display:flex;gap:8px;align-items:center;
  transition:opacity .5s,transform .5s cubic-bezier(.2,1.3,.4,1),color .4s,border-color .4s,box-shadow .4s;animation:cin .45s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.7)}}
.gc i{font-style:normal;opacity:.8}
.gc.raus{opacity:.15;transform:scale(.82)}
.gc.gewinner{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px var(--gold-a60);transform:scale(1.1) translateY(-3px);animation:win 1.4s ease-in-out infinite alternate}
@keyframes win{to{box-shadow:0 0 30px var(--gold-a60),0 0 4px var(--gold)}}
.g-datasite .gc{background:var(--ink-a60)}
.g-datasite .gc.raus{transform:scale(.5) translate(var(--rot),-20px);opacity:0}
.g-riddle .gc em{font-style:normal;font-weight:800;min-width:2.2em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.g-riddle .gc em.done{color:var(--gold);animation:gin .3s}
.g-riddle .gc.raus em{color:var(--muted)}
.g-battle .gc{flex-direction:column;min-width:96px;padding:10px 12px;border-width:2px;background:linear-gradient(160deg,var(--edge-a25),transparent);animation:flipin .6s cubic-bezier(.2,1.3,.4,1) backwards;transform-style:preserve-3d}
@keyframes flipin{from{opacity:0;transform:rotateY(100deg) translateY(30px)}}
.g-battle .gc.raus{transform:rotateY(90deg) scale(.8);opacity:0}
.g-treasure .gc{transform:rotate(var(--rot,0deg));background:var(--ink-a60);animation:drop .7s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(40deg)}}
.g-treasure .gc.raus{transform:rotate(calc(var(--rot) * 4)) translateY(20px);opacity:.12}
.g-treasure .gc.gewinner{transform:rotate(0) scale(1.12)}
.shake{animation:shake .45s linear}
@keyframes shake{20%{transform:translate(-9px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-1px)}}

/* ----- Rätsel ----- */
.rd{position:absolute;inset:0;overflow:hidden}
.rd .wall{position:absolute;inset:0;opacity:.55;
  background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 30%,transparent 70%,rgba(0,0,0,.6)),
   repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.35) 38px 41px),
   repeating-linear-gradient(90deg,transparent 0 78px,rgba(0,0,0,.3) 78px 81px),
   linear-gradient(160deg,#4a4036,#2a231c)}
.rd .light{position:absolute;inset:0;background:radial-gradient(ellipse at 8% 40%,rgba(255,170,60,.28),transparent 45%),radial-gradient(ellipse at 92% 40%,rgba(255,170,60,.28),transparent 45%);animation:flick2 .18s steps(2) infinite alternate}
@keyframes flick2{to{opacity:.8}}
.rd .torch{position:absolute;top:30%;width:14px;height:70px;background:linear-gradient(#6b4a2a,#3a2716);border-radius:3px}
.rd .torch.l{left:5%}.rd .torch.r{right:5%}
.rd .torch i{position:absolute;left:50%;top:-34px;width:30px;height:44px;margin-left:-15px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 75%,#fff6b0,#ffb52e 40%,#ff5a1f 70%,transparent 72%);animation:flick .2s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px #ff9a2e)}
.rd .torch b{position:absolute;left:-6px;right:-6px;top:-6px;height:10px;background:#5a3a1c;border-radius:3px}
.rd .seals{position:absolute;top:10px;right:12px;display:flex;gap:10px;z-index:3}
.rd .seals i{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-style:normal;color:var(--gold);font-size:16px;
  background:radial-gradient(circle,var(--gold-a25),transparent 70%);transition:all .5s}
.rd .seals i.br{background:var(--gold);color:var(--ink);box-shadow:0 0 18px var(--gold);animation:sealpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes sealpop{0%{transform:scale(1.6) rotate(-30deg)}100%{transform:scale(1)}}
.rdbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px 60px;z-index:2}
.rdbox.enter{animation:rdin .7s cubic-bezier(.2,1.1,.4,1)}
@keyframes rdin{from{opacity:0;transform:scale(.92) translateY(20px);filter:blur(4px)}}
.guard{display:flex;gap:22px;align-items:center;max-width:94%}
.guard .head{position:relative;width:clamp(84px,8vw,124px);aspect-ratio:.82;flex:none;border-radius:42% 42% 30% 30%/50% 50% 28% 28%;
  background:radial-gradient(ellipse at 35% 25%,#b8b2a4,#7d776b 55%,#4f4a42);box-shadow:inset -8px -10px 18px rgba(0,0,0,.45),0 0 26px var(--gold-a25);animation:breath 3.2s ease-in-out infinite}
@keyframes breath{50%{transform:translateY(-4px)}}
.guard .brow{position:absolute;left:16%;right:16%;top:30%;height:9%;background:#5a554c;border-radius:4px}
.guard .eye{position:absolute;top:42%;width:18%;height:7%;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold),0 0 26px var(--gold);animation:glow 1.6s ease-in-out infinite alternate}
.guard .eye.l{left:22%}.guard .eye.r{right:22%}
@keyframes glow{to{opacity:.65}}
.guard .mouth{position:absolute;left:34%;right:34%;top:70%;height:5%;background:#2a2620;border-radius:3px;transform-origin:center}
.guard.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(2.6)}}
.guard .crack{position:absolute;left:62%;top:8%;width:2px;height:30%;background:#3e3a33;transform:rotate(18deg)}
.guard.angry .eye{background:#ff3b2f;box-shadow:0 0 14px #ff3b2f,0 0 30px #ff3b2f}
.guard.angry .head{animation:shake .45s linear}
.bubble{background:var(--ink2-a90);border:2px solid var(--line);border-radius:16px;padding:14px 20px;font-size:clamp(18px,1.7vw,27px);font-family:var(--font-head);line-height:1.3;position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:gin .5s .2s backwards}
.bubble::before{content:"";position:absolute;left:-12px;top:40%;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble small{display:block;font-family:var(--font);font-size:13px;color:var(--muted);margin-bottom:4px}
.bubble .caret{color:var(--gold);animation:glow .5s steps(2) infinite}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(780px,94%)}
.answers div{border:2px solid var(--line);border-radius:var(--tag-radius);padding:11px 16px;font-size:clamp(15px,1.35vw,21px);background:var(--ink-a60);
  transition:all .35s;animation:ain .5s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes ain{from{opacity:0;transform:translateX(-30px)}}
.answers div b{color:var(--gold);margin-right:10px}
.answers .guess{border-color:var(--edge);box-shadow:0 0 22px var(--edge-a60);transform:scale(1.04);animation:pulse .45s ease-in-out infinite alternate}
.answers .wrong{border-color:var(--host);opacity:.4;text-decoration:line-through;transform:scale(.96);animation:shake .45s linear}
.answers .right{border-color:var(--decker);color:var(--decker);box-shadow:0 0 30px var(--decker-a60);transform:scale(1.07)}
@keyframes pulse{to{transform:scale(1.07)}}
.hint{font-size:clamp(15px,1.35vw,21px);color:var(--muted);text-align:center}
.hint b{display:inline-flex;gap:12px;color:var(--edge);font-size:1.6em;margin-left:10px;vertical-align:middle}
.hint b span{animation:whisper .8s ease-out backwards;text-shadow:0 0 14px var(--edge)}
@keyframes whisper{from{opacity:0;filter:blur(8px);transform:scale(2)}}
.dials{display:flex;gap:clamp(12px,1.6vw,26px);margin-top:26px}
.dial{position:relative;width:clamp(84px,8vw,124px);aspect-ratio:1;animation:gin .6s cubic-bezier(.2,1.3,.4,1) backwards}
.dial small{position:absolute;left:0;right:0;top:-38px;text-align:center;font-size:24px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
.dial .ptr{position:absolute;left:0;right:0;top:-12px;text-align:center;font-style:normal;color:var(--muted);font-size:14px;z-index:2}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle,#3a3128,#1e1912);transition:transform .75s cubic-bezier(.3,1.5,.5,1);box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
.wheel span{position:absolute;inset:0;display:flex;justify-content:center;padding-top:6%}
.wheel span i{font-style:normal;font-size:clamp(17px,1.5vw,24px);color:var(--muted)}
.dial .hub{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a7a5c,#3a3022);box-shadow:0 0 8px rgba(0,0,0,.6)}
.dial.act .wheel{border-color:var(--edge);box-shadow:inset 0 0 18px rgba(0,0,0,.7),0 0 20px var(--edge-a60)}
.dial.wobble .wheel{border-color:var(--host)}
.dial.ok .wheel{border-color:var(--gold);box-shadow:inset 0 0 18px rgba(0,0,0,.5),0 0 26px var(--gold-a60)}
.dial.ok .ptr{color:var(--gold)}
.dial.ok .hub{background:radial-gradient(circle at 35% 30%,#fff1b0,var(--gold));animation:sealpop .5s}
.brz{display:flex;gap:clamp(22px,3.4vw,56px);align-items:flex-end;margin-top:20px}
.brz>div{position:relative;display:flex;flex-direction:column;align-items:center;font-size:30px;color:var(--muted);transition:color .4s}
.brz .flame{position:relative;width:60px;height:80px;opacity:0;transform:scale(.2) translateY(30px);transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.brz .flame i{position:absolute;left:50%;bottom:0;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;animation:flick .22s ease-in-out infinite alternate}
.brz .flame i:nth-child(1){width:56px;height:76px;margin-left:-28px;background:radial-gradient(circle at 50% 75%,#ffb52e,#ff5a1f 60%,transparent 70%);filter:blur(1px)}

/* ----- Bosskampf ----- */
.bt{position:absolute;inset:0;overflow:hidden}
.bt .lines{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 2deg,transparent 2deg 8deg);animation:spin2 40s linear infinite}
.bt .horizon{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(transparent,var(--edge-a15)),repeating-linear-gradient(90deg,transparent 0 60px,var(--edge-a15) 60px 62px);
  transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
.bt .side{position:absolute;bottom:18%;display:flex;flex-direction:column;align-items:center;gap:8px}
.bt .hero{left:12%}.bt .boss{right:9%}
.bt .avatar{position:relative;width:clamp(110px,11vw,170px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(56px,6vw,96px)}

.bt .hero .avatar span{animation:spin2 6s linear infinite;display:inline-block}
.bt .aura{position:absolute;left:50%;top:clamp(55px,5.5vw,85px);width:calc(clamp(110px,11vw,170px) * (1.2 + var(--pw,0)));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:2px dashed var(--decker-a60);animation:spin2 5s linear infinite;box-shadow:0 0 calc(10px + var(--pw,0) * 40px) var(--gold-a40)}
.bt .boss .avatar{width:clamp(170px,17vw,270px);clip-path:polygon(50% 0,63% 22%,88% 8%,80% 36%,100% 50%,80% 64%,88% 92%,63% 78%,50% 100%,37% 78%,12% 92%,20% 64%,0 50%,20% 36%,12% 8%,37% 22%);
  background:radial-gradient(circle at 50% 45%,#2a0b1e 30%,var(--host) 31% 34%,#1a0612 35%);animation:bob 2.2s ease-in-out infinite reverse,bspin 18s linear infinite}
@keyframes bspin{to{rotate:360deg}}
.bt .boss .avatar::after{content:"◣ ◢";position:absolute;top:38%;left:0;right:0;text-align:center;font-size:clamp(20px,2vw,34px);color:var(--host);letter-spacing:.3em;text-shadow:0 0 14px var(--host);animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bt .baura{position:absolute;left:50%;top:clamp(85px,8.5vw,135px);width:clamp(220px,22vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--host-a40),transparent 65%);animation:glow 1.2s ease-in-out infinite alternate}
.bt .boss.f2 .avatar{filter:hue-rotate(40deg) saturate(1.4);scale:1.08}
.bt .boss.f3 .avatar{filter:hue-rotate(-60deg) saturate(1.8) brightness(1.2);scale:1.18}
.bt .boss.enter .avatar{animation:bossin .8s cubic-bezier(.3,1.6,.5,1),bob 2.2s ease-in-out infinite reverse}
@keyframes bossin{from{transform:translateY(-120%) scale(.4);opacity:0}}
.bt .boss.hurt .avatar{animation:hurt .4s}
@keyframes hurt{0%,40%{filter:brightness(4) saturate(0)}25%{transform:translateX(14px)}50%{transform:translateX(-10px)}}
.bt .boss.cast .avatar{animation:cast .4s}
@keyframes cast{50%{transform:scale(1.12) translateX(-16px)}}
.bt .boss.powerup .avatar{animation:pup 1s}
@keyframes pup{0%{transform:scale(1)}30%{transform:scale(1.35);filter:brightness(2)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.bt .boss.ko .avatar{animation:ko 1.4s ease-out forwards}
.bt .boss.ko .baura{opacity:0;transition:opacity 1s}
@keyframes ko{0%{transform:translateX(0)}10%,30%,50%{transform:translateX(-14px);filter:brightness(3)}20%,40%{transform:translateX(14px)}100%{transform:scale(1.8) rotate(25deg);opacity:0;filter:brightness(4)}}
.bt .hero.dash{animation:dash .6s cubic-bezier(.5,0,.3,1)}
@keyframes dash{40%{transform:translateX(var(--dx)) scale(1.1)}55%{transform:translateX(var(--dx)) scale(1.1)}}
.bt .hero.hurt .avatar{animation:hurt .4s}
.bt .hero.dodge{animation:dodge .5s}
@keyframes dodge{40%{transform:translate(-50px,-30px);opacity:.4}}
.bt .hero.transform{animation:tf 1.2s cubic-bezier(.3,1.4,.5,1)}
@keyframes tf{0%{transform:scale(.2) rotate(-200deg);opacity:0;filter:brightness(4)}100%{transform:none}}
.bt .ghost{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--decker-a60),transparent 65%);animation:fadeout .5s forwards;pointer-events:none}
@keyframes fadeout{to{opacity:0;transform:scale(.8)}}
.bt .slash{position:absolute;width:260px;height:260px;border-radius:50%;border-top:10px solid #fff;border-right:4px solid var(--decker);filter:drop-shadow(0 0 12px var(--decker));animation:slash .45s ease-out forwards;pointer-events:none}
@keyframes slash{0%{clip-path:inset(0 100% 0 0);opacity:1}60%{clip-path:inset(0 0 0 0);opacity:1}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.bt .orbshot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle,#fff,#b04aff 40%,#40104a 70%,transparent 72%);
  box-shadow:0 0 30px #b04aff;animation:shot .42s cubic-bezier(.5,0,.8,.6) forwards;pointer-events:none}
@keyframes shot{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:.6}}
.bt .beam{position:absolute;height:90px;margin-top:-45px;transform-origin:left center;border-radius:45px;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--gold) 22%,#fff 45%,#fff 55%,var(--decker) 78%,transparent);box-shadow:0 0 60px var(--gold),0 0 120px var(--decker)}
.bt .beam.go{animation:beam 1.3s ease-out forwards}
@keyframes beam{0%{opacity:1;transform:scaleX(0) scaleY(.3)}20%{opacity:1;transform:scaleX(1) scaleY(1.1)}30%{transform:scaleX(1) scaleY(.9)}40%{transform:scaleX(1) scaleY(1.15)}80%{opacity:1;transform:scaleX(1) scaleY(1)}100%{opacity:0;transform:scaleX(1) scaleY(.05)}}
.bt .pillar{position:absolute;top:-10%;bottom:10%;width:140px;margin-left:-70px;background:linear-gradient(90deg,transparent,var(--decker-a60),#fff,var(--decker-a60),transparent);animation:pillar 1.4s ease-out forwards;pointer-events:none}
@keyframes pillar{0%{transform:scaleX(0);opacity:1}25%{transform:scaleX(1)}100%{transform:scaleX(.1);opacity:0}}
.bt .name{font-family:var(--font-head);font-size:clamp(16px,1.4vw,22px);color:var(--text);text-shadow:2px 2px 0 var(--ink)}
.bt .hp{position:absolute;top:14px;width:40%;z-index:2}
.bt .hp.l{left:14px}.bt .hp.r{right:14px}
.bt .hp small{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}
.bt .segs{display:flex;gap:4px}.bt .segs .bar{flex:1}
.bt .combo{position:absolute;left:16px;top:60px;font-family:var(--font-head);font-size:clamp(24px,2.2vw,38px);color:var(--edge);text-shadow:3px 3px 0 var(--ink);z-index:2}
.bt .combo.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{from{transform:scale(1.8) rotate(-8deg)}}
.bt .cut{position:absolute;left:-6%;right:-6%;top:36%;transform:rotate(-6deg);padding:14px 9% 14px 22%;font-family:var(--font-head);font-size:clamp(22px,2.6vw,44px);line-height:1.15;letter-spacing:.04em;
  color:var(--ink);background:repeating-linear-gradient(100deg,transparent 0 30px,rgba(255,255,255,.18) 30px 34px),var(--decker);box-shadow:0 0 0 4px var(--ink),0 0 50px var(--decker);opacity:0;pointer-events:none;z-index:4}
.bt .cut .eyes{position:absolute;left:7%;top:50%;transform:translateY(-50%);display:flex;gap:16px}
.bt .cut .eyes i{width:42px;height:16px;border-radius:50% 50% 50% 50%/80% 80% 20% 20%;background:var(--ink);box-shadow:inset 0 -5px 0 #fff;transform:skewX(-12deg)}
.bt .cut.boss{background:repeating-linear-gradient(100deg,transparent 0 30px,rgba(0,0,0,.18) 30px 34px),var(--host);color:#fff;box-shadow:0 0 0 4px var(--ink),0 0 50px var(--host)}
.bt .cut.boss .eyes i{background:#fff;box-shadow:0 0 12px #fff}
.bt .cut.ult{background:linear-gradient(90deg,var(--edge),var(--gold),var(--decker));color:var(--ink);font-size:clamp(26px,3vw,52px)}
.bt .cut.go{animation:cut 1.25s ease-out forwards}
@keyframes cut{0%{opacity:0;transform:rotate(-6deg) translateX(-70%) scaleY(.4)}12%{opacity:1;transform:rotate(-6deg) translateX(0) scaleY(1.1)}18%{transform:rotate(-6deg) scaleY(1)}85%{opacity:1;transform:rotate(-6deg) translateX(2%)}100%{opacity:0;transform:rotate(-6deg) translateX(8%) scaleY(.2)}}
.bt .gauge{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.bt .gauge small{font-size:13px;color:var(--edge)}
.bt .gauge .bar{height:14px}
.bt .gauge .bar i{background:linear-gradient(90deg,var(--edge),var(--gold),#fff)}
.bt .kotext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-head);font-size:clamp(80px,10vw,170px);color:var(--gold);z-index:5;
  text-shadow:6px 6px 0 var(--ink),0 0 50px var(--gold);animation:stamp 2.6s cubic-bezier(.2,1.6,.4,1) forwards;pointer-events:none}
@keyframes stamp{0%{transform:scale(4) rotate(-20deg);opacity:0}15%{transform:scale(1) rotate(-8deg);opacity:1}85%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-8deg)}}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ---------- Teilnahmephase ---------- */
.open{width:min(760px,100%);padding:28px 32px;display:grid;grid-template-columns:1fr auto;gap:6px 24px}
.open h1{margin:0;font-size:clamp(28px,3vw,46px);line-height:1.05;font-weight:700}
.open .call{grid-column:1/-1;font-size:clamp(18px,1.7vw,24px);color:var(--muted)}
.open .call kbd{font:inherit;font-weight:700;color:var(--ink);background:var(--decker);padding:0 10px;border-radius:var(--tag-radius)}
.clock{grid-row:1/3;grid-column:2;text-align:right;font-size:clamp(34px,4vw,64px);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.clock.urgent{color:var(--glitch)}
.clock small{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.joined{grid-column:1/-1;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.joined span{padding:4px 10px;border:1px solid var(--line);border-radius:var(--tag-radius);font-size:15px}
.joined span:first-child{border-color:var(--decker);color:var(--decker)}
.count{grid-column:1/-1;color:var(--muted);font-size:15px;margin-top:12px}
.count b{color:var(--text);font-size:20px}

/* ---------- Gewinner ---------- */
.winner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;min-width:min(780px,90vw);text-align:center;
  padding:28px 40px 32px;background:var(--winner-bg);border:2px solid var(--gold);border-radius:var(--panel-radius);box-shadow:0 0 60px var(--gold-a40)}
.winner small{display:block;font-size:clamp(14px,1.4vw,20px);color:var(--gold);letter-spacing:.05em}
.winner strong{display:block;font-size:clamp(36px,6vw,92px);line-height:1.05;margin-top:6px;overflow-wrap:anywhere;color:var(--text)}
.winner p{margin:10px 0 0;color:var(--muted);font-size:15px}
.winner.show{animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
.winner.has-pic{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:32px;text-align:left}
.portrait{margin:0;width:clamp(150px,14vw,240px);aspect-ratio:1;border:2px solid var(--gold);border-radius:var(--panel-radius);overflow:hidden;position:relative;background:var(--ink2)}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--portrait-overlay)}
.weve{margin-top:8px;font-size:clamp(18px,1.8vw,28px);color:var(--decker);font-weight:600}
.weve span{color:var(--muted);font-weight:500;margin-left:10px}
.winner.has-pic strong{font-size:clamp(32px,4.6vw,76px)}
.wprize{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:clamp(16px,1.6vw,24px);color:var(--gold);font-weight:600}
.winner:not(.has-pic) .wprize{justify-content:center}
.wprize img,.wcard .pz img{width:1.6em;height:1.6em;border:1px solid var(--line);background:var(--ink2)}
.winner.multi{min-width:min(1180px,94vw);max-height:90vh;overflow:hidden;text-align:left}
.winner.multi>small{text-align:center}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.wcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--tag-radius);background:var(--ink2-a90)}
.wcard .ph{grid-row:1/4;width:64px;height:64px;border:1px solid var(--gold);border-radius:var(--tag-radius);object-fit:cover;background:var(--ink2)}
.wcard .ph.none{display:grid;place-items:center;color:var(--gold);font-weight:700;font-size:22px}
.wcard b{font-size:20px;overflow-wrap:anywhere;color:var(--text)}
.wcard .ev{color:var(--decker);font-size:14px}
.wcard .pz{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:14px;font-weight:600}
.wcard .no{color:var(--muted);font-size:12px;font-weight:600}
.wmore{margin-top:10px;text-align:center;color:var(--muted)}
.prize{grid-column:1/-1;margin-top:12px;font-size:clamp(16px,1.5vw,22px);line-height:1.35;color:var(--gold);font-weight:600}
.prize span{color:var(--muted);font-weight:500;margin-right:6px}
.prize em{font-style:normal;color:var(--text);margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
@keyframes drop{from{transform:translate(-50%,-60%) scale(.9);opacity:0}}

.idle{position:fixed;left:14px;bottom:12px;color:var(--muted);font-size:12px}
.idle::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--decker);margin-right:6px}
.idle.off::before{background:var(--glitch)}
body[data-hide="1"] .idle{display:none}
.demo{position:fixed;right:14px;bottom:12px;color:var(--edge);font-size:12px}
[hidden]{display:none!important}

body[data-view="graph"] .run{grid-template-columns:1fr}
body[data-view="graph"] .sheet{display:none}
body[data-view="log"] .run{grid-template-columns:1fr;max-width:460px}
body[data-view="log"] .left{display:none}
@media (max-width:820px){.run{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}.pool{grid-template-columns:1fr auto}.pool .lbl{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
const q=new URLSearchParams(location.search);
const demo=q.get('demo')==='1'||location.pathname==='/test';
const view=['graph','log'].includes(q.get('view'))?q.get('view'):'full';
document.body.dataset.view=view;
document.body.dataset.hide=q.get('hide')==='1'?'1':'0';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S={visible:false,mode:'idle'};      // letzter Zustand

// ---------- Design (Beschriftungen, Form, Farben) ----------
let UI={}, SHAPE='hex', themeKey='', COL={};
const U=(k,vars)=>{let s=UI[k]??'';for(const [a,b] of Object.entries(vars||{}))s=s.split(`{${a}}`).join(b);return s;};
function readColors(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  COL={decker:g('--decker'),host:g('--host'),gold:g('--gold'),text:g('--text'),glitch:g('--glitch'),ink:g('--ink'),edge:g('--edge'),ink2:g('--ink2'),
    fill:g('--node-fill'),locked:g('--node-locked'),lockedLabel:g('--node-label-locked'),line:g('--line'),
    font:g('--font-head')||g('--font')};
  const st=document.documentElement.style;
  for(const n of ['decker','host','gold','edge','ink','ink2','text','glitch'])for(const l of [8,15,25,40,60,90])st.setProperty(`--${n}-a${l}`,alpha(g('--'+n),l/100));
  st.setProperty('--good-text',mixCol(g('--decker'),g('--text'),.55));st.setProperty('--bad-text',mixCol(g('--host'),g('--text'),.55));
}
async function ensureTheme(id,v){
  const key=`${id||''}#${v||0}`;if(key===themeKey)return;themeKey=key;
  let t;try{t=await (await fetch('/api/theme'+(id?`?id=${encodeURIComponent(id)}`:''),{cache:'no-store'})).json();}catch(e){themeKey='';return;}
  if(themeKey!==key)return;
  UI=t.ui||{};SHAPE=t.shape||'hex';document.body.dataset.theme=t.id;
  if(t.font_url&&$('tfont').getAttribute('href')!==t.font_url)$('tfont').href=t.font_url;
  const css=$('tcss');css.onload=()=>{readColors();kick();};css.href=`/theme/${encodeURIComponent(t.id)}.css?v=${v||0}`;
  document.querySelectorAll('[data-ui]').forEach(el=>{const s=U(el.dataset.ui);if(s)el.textContent=s;});
  if(!$('idle').classList.contains('off'))$('idle').textContent=U('conn_idle');
  readColors();apply(S);
}
let lastRoll=-1, lastWinner='', raf=0, frame=0, rollUntil=0;

// Augen-Positionen im 3×3-Raster (Index 0..8)
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function die(v,cls){
  const on=PIPS[v]||[];
  let h='';for(let i=0;i<9;i++)h+=`<i style="visibility:${on.includes(i)?'visible':'hidden'}"></i>`;
  return `<span class="die ${cls}" aria-label="${v}">${h}</span>`;
}
function diceRow(pool,side,rolling){
  const d=pool.dice.map(v=>rolling?die(1+Math.floor(Math.random()*6),''):die(v,v>=5?'hit':v===1?'one':'miss')).join('');
  return `<div class="dice ${side}${rolling?' rolling':''}">${d}</div>`;
}
function hitsWord(n){return n===1?U('hit1'):U('hitN')}

function renderTray(run,now){
  const t=$('tray');const r=run.roll;
  if(!r){
    if(run.candidates&&run.candidates.length){
      t.innerHTML=`<div class="action"><h2>${esc(U('register'))}</h2></div><div class="cands">${
        run.candidates.map(c=>`<span class="cand ${esc(c.state)}">${esc(c.name)}</span>`).join('')}</div>`;
    }else{
      const ic=['ice','bomb','converge'].includes(run.phase_key);
      t.innerHTML=`<div class="announce${ic?' threat':''}">${esc(run.phase_text||'')}</div>`;
    }
    return;
  }
  if(r.id!==lastRoll){lastRoll=r.id;rollUntil=now+520;}
  const rolling=now<rollUntil;
  const actorName=r.actor==='decker'?run.decker:(r.actor==='ice'?U('actor_ice'):U('actor_host'));
  const attSide=r.actor==='decker'?'':'host', defSide=r.actor==='decker'?'host':'';
  let h=`<div class="action"><span class="actor ${esc(r.actor)}">${esc(actorName)}</span><h2>${esc(r.action)}</h2></div>`;
  h+=`<div class="pool"><div class="lbl"><strong>${r.attacker.dice.length} ${esc(U('dice'))}</strong>${esc(r.attacker.label)}</div>${diceRow(r.attacker,attSide,rolling)}
      <div class="hits">${rolling?'…':r.attacker.hits}<small>${rolling?'':hitsWord(r.attacker.hits)}</small></div></div>`;
  if(r.defender){
    h+=`<div class="pool"><div class="lbl"><strong>${r.defender.dice.length} ${esc(U('dice'))}</strong>${esc(r.defender.label)}</div>${diceRow(r.defender,defSide,rolling)}
        <div class="hits">${rolling?'…':r.defender.hits}<small>${rolling?'':hitsWord(r.defender.hits)}</small></div></div>`;
  }else if(r.threshold){
    h+=`<div class="pool"><div class="lbl">${esc(U('threshold'))}</div><div></div><div class="hits">${r.threshold}</div></div>`;
  }
  if(!rolling){
    h+=`<div class="verdict"><span class="v ${r.success?'':'fail'}">${esc(r.verdict)}</span>`;
    if(r.defender)h+=`<span class="traynote">${esc(U('net'))} ${r.net>0?'+':''}${r.net}</span>`;
    if(r.edge)h+=`<span class="tag edge">${esc(U('edge_tag'))}</span>`;
    if(r.critical)h+=`<span class="tag glitch">${esc(U('crit'))}</span>`;
    else if(r.glitch)h+=`<span class="tag glitch">${esc(U('glitch'))}</span>`;
    h+=`</div>`;
  }
  t.innerHTML=h;
}

function boxes(el,n,max){let h='';for(let i=0;i<max;i++)h+=`<i class="${i<n?'x':''}"></i>`;el.innerHTML=h;}
function renderSheet(run){
  $('decker').textContent=run.decker;
  $('deck').textContent=`${run.deck} · ${run.sim}`;
  $('osv').textContent=`${run.os} / ${run.os_max}`;
  let os='';for(let i=0;i<run.os_max;i++)os+=`<i class="${i<run.os?'on':''}"></i>`;
  $('os').innerHTML=os;$('os').classList.toggle('hot',run.os>=30);
  let m='';for(let i=0;i<3;i++)m+=`<i class="${i<run.marks?'on':''}"></i>`;$('marks').innerHTML=m;
  let e='';for(let i=0;i<run.edge_max;i++)e+=`<i class="${i<run.edge?'on':''}"></i>`;$('edge').innerHTML=e;
  const a=$('alert');a.textContent=U('alert_'+run.alert);a.className='alert '+run.alert;
  $('cmv').textContent=`${run.matrix_cm} / ${run.matrix_max}`;boxes($('cm'),run.matrix_cm,run.matrix_max);
  $('stv').textContent=`${run.stun} / ${run.stun_max}`;boxes($('st'),run.stun,run.stun_max);
  $('icerow').hidden=!run.ice.length;
  $('ice').innerHTML=run.ice.map(i=>`<div class="${i.status==='active'?'':'down'}"><span>${esc(i.name)}</span><span>${i.status==='active'?`${i.hp}/${i.hp_max}`:esc(i.status_text)}</span></div>`).join('');
  $('log').innerHTML=run.log.slice(-14).map(l=>`<p class="${esc(l.tone)}">${esc(l.text)}</p>`).join('');
}
function renderRun(run){
  $('host').textContent=run.host;
  $('hostmeta').textContent=U('host_level',{r:run.host_rating});
  const n=(U('attrs')||'A S D F').split(/\s+/);$('asdf').innerHTML=run.asdf.map((v,i)=>`<span><b>${n[i]}</b>${v}</span>`).join('');
  $('phase').innerHTML=`<em>${esc(run.phase)}</em>${esc(run.phase_text)}`;
  renderSheet(run);
}

// ---------- Knotenpfad (Canvas) ----------
// Knotenform je Design: hex | ring | diamond | circle | star
function poly(x,cx,cy,r,n,rot,inner){x.beginPath();const k=inner?n*2:n;for(let i=0;i<k;i++){const a=rot+Math.PI*2*i/k,rr=inner&&i%2?r*inner:r;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}x.closePath();}
function shape(x,cx,cy,r){
  if(SHAPE==='circle'||SHAPE==='ring'){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.closePath();}
  else if(SHAPE==='diamond')poly(x,cx,cy,r*1.08,4,-Math.PI/2);
  else if(SHAPE==='star')poly(x,cx,cy,r*1.12,5,-Math.PI/2,.62);
  else poly(x,cx,cy,r,6,Math.PI/6);
}
function ringExtra(x,cx,cy,r,col){if(SHAPE!=='ring')return;x.beginPath();x.arc(cx,cy,r*.72,0,Math.PI*2);x.strokeStyle=col;x.lineWidth=1;x.globalAlpha=.6;x.stroke();x.globalAlpha=1;}
// Farben ohne color-mix() (ältere OBS-Browserquellen kennen es nicht)
function parseCol(c){c=String(c||'').trim();let m;
  if(c[0]==='#'){let h=c.slice(1);if(h.length<=4)h=[...h].map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16);return [n>>16&255,n>>8&255,n&255,h.length===8?parseInt(h.slice(6),16)/255:1];}
  if((m=c.match(/rgba?\(([^)]+)\)/))){const p=m[1].split(/[\s,\/]+/).filter(Boolean).map(parseFloat);return [p[0],p[1],p[2],p[3]==null?1:p[3]];}
  return null;}
const alpha=(c,a)=>{const p=parseCol(c);return p?`rgba(${p[0]},${p[1]},${p[2]},${Math.max(0,Math.min(1,p[3]*a)).toFixed(3)})`:c;};
const mixCol=(c1,c2,t)=>{const a=parseCol(c1),b=parseCol(c2);if(!a||!b)return c1;return `rgb(${a.map((v,i)=>i<3?Math.round(v*t+b[i]*(1-t)):0).slice(0,3).join(',')})`;};
function draw(){
  raf=0;const run=S.run;if(!S.visible||!run){return;}
  if(run.game&&run.game!=='dice'){gameFrame(run);frame++;raf=requestAnimationFrame(draw);return;}
  const c=$('graph'),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(rect.width<10||rect.height<10){raf=requestAnimationFrame(draw);return;}
  c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=rect.height;x.clearRect(0,0,w,h);
  const N=run.nodes.length, r=Math.max(18,Math.min(44,h/5,w/(N*2.4)));
  const pts=run.nodes.map((n,i)=>({x:r*1.4+(w-r*2.8)*i/(N-1),y:h/2+(i%2?-1:1)*h*0.16,n}));
  // Verbindungen
  for(let i=0;i<N-1;i++){const a=pts[i],b=pts[i+1],done=['done','target'].includes(a.n.status);
    x.strokeStyle=done?alpha(COL.decker,.7):alpha(COL.locked,.8);x.lineWidth=done?2.5:1.5;x.setLineDash(done?[]:[5,6]);
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
  x.setLineDash([]);
  // Datenpakete auf der aktiven Strecke
  const ai=run.node; if(ai>0&&!run.done){const a=pts[ai-1],b=pts[ai];for(let k=0;k<3;k++){const t=((frame/50)+k/3)%1;
    x.fillStyle=COL.decker;x.beginPath();x.arc(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,3,0,7);x.fill();}}
  // Knoten
  pts.forEach((p,i)=>{const st=p.n.status;
    const col=st==='alert'?COL.host:st==='target'?COL.gold:st==='done'?COL.decker:st==='active'?COL.text:COL.locked;
    const pulse=(st==='active'||st==='alert')?Math.sin(frame*.12)*3:0;
    x.shadowColor=col;x.shadowBlur=st==='locked'?0:14+pulse*2;
    shape(x,p.x,p.y,r+pulse*.5);x.fillStyle=COL.fill;x.fill();x.lineWidth=st==='active'?3:2;x.strokeStyle=col;x.stroke();x.shadowBlur=0;
    ringExtra(x,p.x,p.y,r+pulse*.5,col);
    x.fillStyle=col;x.font=`700 ${Math.round(r*.42)}px ${COL.font}`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(String(i+1),p.x,p.y);
    x.font=`600 ${Math.max(11,Math.round(r*.32))}px ${COL.font}`;x.fillStyle=st==='locked'?COL.lockedLabel:COL.text;
    x.fillText(p.n.label,p.x,p.y+(i%2?-1:1)*(r+16));
  });
  // IC um den Sicherheitsknoten
  const ice=run.ice.filter(i=>i.status==='active'), sec=pts[3];
  ice.forEach((ic,k)=>{const ang=frame*.03+k*2.1, rr=r*1.9;const ix=sec.x+Math.cos(ang)*rr, iy=sec.y+Math.sin(ang)*rr*.7;
    x.shadowColor=COL.host;x.shadowBlur=16;shape(x,ix,iy,r*.42);x.fillStyle=ic.kind==='black'?'#000':COL.host;x.fill();
    x.strokeStyle=COL.host;x.lineWidth=2;x.stroke();x.shadowBlur=0;
    const lbl=U('actor_ice');x.fillStyle=ic.kind==='black'?COL.host:COL.ink;x.font=`700 ${Math.round(r*.3*Math.min(1,2.2/Math.max(1,lbl.length)))}px ${COL.font}`;x.fillText(lbl.slice(0,6),ix,iy);});
  // Persona
  // Persona-Marker auf der Seite ohne Beschriftung
  const pi=Math.min(run.node,N-1),p=pts[pi],bob=Math.sin(frame*.1)*3,dir=pi%2?1:-1;
  const tip=p.y+dir*(r+10)+bob,base=p.y+dir*(r+24)+bob;
  x.fillStyle=run.converged?COL.glitch:COL.decker;x.shadowColor=x.fillStyle;x.shadowBlur=18;
  x.beginPath();x.moveTo(p.x,tip);x.lineTo(p.x-8,base);x.lineTo(p.x+8,base);x.closePath();x.fill();x.shadowBlur=0;
  frame++;
  renderTray(run,performance.now());
  raf=requestAnimationFrame(draw);
}
function kick(){if(!raf)raf=requestAnimationFrame(draw);}


// ---------- Spiel-Abläufe (EVE-Data-Site, Schatzsuche, Rätsel, Bosskampf) ----------
const now=()=>performance.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp01=t=>t<0?0:t>1?1:t;
const ease=t=>1-Math.pow(1-clamp01(t),3);
const easeBack=t=>{t=clamp01(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const pct=(a,b)=>`${Math.max(0,Math.min(100,b?a/b*100:0))}%`;
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const DSG={core:'◎',firewall:'▦',antivirus:'☣',restoration:'✚',suppressor:'▼',kernel_rot:'☠',self_repair:'♥',poly_shield:'◈',secondary_vector:'➶',cache:'▣'};
const TRE={tree:'🌳',flower:'🌷',rock:'🌾',house:'🏡',bush:'🌿',mushroom:'🍄',lamp:'🏮'};
const TEV={crow:'🐦',rain:'🌧',bees:'🐝',neighbor:'👋',cat:'🐈'};
const RSYM=['☉','☽','☿','♀','♂','♃','♄','♆'];
let GS={};
function resetGS(game){GS={game,prev:null,fxId:-1,parts:[],lastT:now(),flash:0,tint:null,shakeT:0,shakeA:0,shakeD:400,
  walk:null,walkPos:null,trail:[],nodeT:{},hitT:{},orb:null,bolt:null,spew:0,L:null,amb:null,
  holeT:{},chestT:0,lidT:0,digT:0,evT:0,zone:null,stage:'',wheel:{},candKey:'',emitters:[]};}
resetGS('');
function shake(a,ms){GS.shakeA=Math.max(GS.shakeA,a);GS.shakeD=ms||400;GS.shakeT=now()+GS.shakeD;}
function flash(a){GS.flash=Math.max(GS.flash,a);}
function tint(col,a){GS.tint={col,a};}
function emit(o){GS.parts.push(Object.assign({age:0,life:1,vx:0,vy:0,g:0,drag:0,size:4,rot:0,vr:0,kind:'dot',col:'#fff',a:1,ph:Math.random()*6},o));}
function burst(x,y,n,o){for(let i=0;i<n;i++){const an=rnd(0,Math.PI*2),sp=(o.speed||200)*rnd(.3,1);
  emit(Object.assign({},o,{x,y,vx:Math.cos(an)*sp+(o.vx||0),vy:Math.sin(an)*sp+(o.vy||0),life:(o.life||.9)*rnd(.6,1.25),size:(o.size||4)*rnd(.6,1.4),rot:rnd(0,6),vr:rnd(-8,8)}));}}
function ring(x,y,col,grow,life,lw,size){emit({kind:'ring',x,y,col,grow:grow||120,life:life||.7,lw:lw||4,size:size||4});}
function later(ms,fn){setTimeout(()=>{if(GS)fn();},ms);}
function relPos(el){const s=$('gstage').getBoundingClientRect(),r=el.getBoundingClientRect();return {x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,w:r.width,h:r.height};}

function drawParts(x,dt){
  const ps=GS.parts;let j=0;
  for(const p of ps){p.age+=dt;if(p.age>=p.life||p.age<0&&false)continue;ps[j++]=p;
    if(p.age<0)continue;
    p.vy+=p.g*dt;if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}
    if(p.to){const k=Math.min(1,dt*p.home);p.vx+=(p.to.x-p.x)*k*4;p.vy+=(p.to.y-p.y)*k*4;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const t=p.age/p.life;let al=p.a*(1-Math.pow(t,p.fadePow||2));if(p.fadeIn&&t<.15)al*=t/.15;
    x.globalAlpha=Math.max(0,Math.min(1,al));
    switch(p.kind){
      case 'dot':{x.fillStyle=p.col;if(p.glow){x.shadowColor=p.col;x.shadowBlur=p.glow;}x.beginPath();x.arc(p.x,p.y,Math.max(.1,p.size*(p.shrink?1-t:1)),0,7);x.fill();x.shadowBlur=0;break;}
      case 'spark':{x.strokeStyle=p.col;x.lineWidth=p.size*(1-t*.6);x.lineCap='round';const l=p.len||.045;
        if(p.glow){x.shadowColor=p.col;x.shadowBlur=p.glow;}x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.vx*l,p.y-p.vy*l);x.stroke();x.shadowBlur=0;break;}
      case 'square':{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.size/2,-p.size/2,p.size,p.size*(p.ratio||1));x.restore();break;}
      case 'ring':{x.strokeStyle=p.col;x.lineWidth=Math.max(.1,(p.lw||3)*(1-t));if(p.glow){x.shadowColor=p.col;x.shadowBlur=p.glow;}
        x.beginPath();x.arc(p.x,p.y,p.size+p.grow*ease(t),0,7);x.stroke();x.shadowBlur=0;break;}
      case 'text':case 'emoji':{x.save();x.translate(p.x,p.y);x.rotate(p.rot);const sc=p.pop?easeBack(p.age/.3):1;x.scale(sc,sc);
        x.textAlign='center';x.textBaseline='middle';
        if(p.kind==='emoji'){x.font=`${p.size}px ${EMO}`;x.fillStyle='#000';}
        else{x.font=`${p.weight||800} ${p.size}px ${p.font||COL.font}`;x.lineJoin='round';x.lineWidth=Math.max(3,p.size/6);x.strokeStyle=p.stroke||COL.ink;x.strokeText(p.text,0,0);x.fillStyle=p.col;}
        x.fillText(p.text,0,0);x.restore();break;}
      case 'label':{x.save();x.translate(p.x,p.y);const sc=easeBack(p.age/.3);x.scale(sc,sc);x.font=`700 ${p.size}px ${COL.font}`;
        const tw=x.measureText(p.text).width+p.size*1.2,th=p.size*1.9;x.fillStyle=p.bg||'rgba(255,255,255,.95)';x.strokeStyle=COL.line;x.lineWidth=2;
        x.beginPath();x.roundRect(-tw/2,-th/2,tw,th,th/2);x.fill();x.stroke();x.fillStyle=p.col||'#3a2c1c';x.textAlign='center';x.textBaseline='middle';x.fillText(p.text,0,1);x.restore();break;}
      case 'petal':{x.save();x.translate(p.x+Math.sin(p.age*2+p.ph)*22,p.y);x.rotate(p.rot);x.scale(1,Math.abs(Math.sin(p.age*3+p.ph))*.7+.3);
        x.fillStyle=p.col;x.beginPath();x.ellipse(0,0,p.size,p.size*.6,0,0,7);x.fill();x.restore();break;}
      case 'paper':{x.save();x.translate(p.x+Math.sin(p.age*3+p.ph)*16,p.y);x.rotate(p.rot);x.scale(Math.cos(p.age*4+p.ph),1);
        x.fillStyle='#fffaf0';x.strokeStyle='rgba(120,90,60,.45)';x.lineWidth=1;x.fillRect(-p.size*.6,-p.size*.42,p.size*1.2,p.size*.84);x.strokeRect(-p.size*.6,-p.size*.42,p.size*1.2,p.size*.84);
        x.fillStyle='rgba(120,90,60,.5)';x.fillRect(-p.size*.4,-p.size*.12,p.size*.8,1.5);x.fillRect(-p.size*.4,p.size*.12,p.size*.5,1.5);x.restore();break;}
      case 'coin':{x.save();x.translate(p.x,p.y);x.scale(Math.abs(Math.cos(p.age*9+p.ph))*.85+.15,1);const g=x.createRadialGradient(-p.size*.3,-p.size*.3,0,0,0,p.size);
        g.addColorStop(0,'#fff3b0');g.addColorStop(1,p.col||'#e8a90c');x.fillStyle=g;x.beginPath();x.arc(0,0,p.size,0,7);x.fill();x.strokeStyle='rgba(120,80,0,.55)';x.lineWidth=1.5;x.stroke();x.restore();break;}
      case 'can':{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.shadowColor=COL.gold;x.shadowBlur=10;x.strokeStyle=COL.gold;x.lineWidth=2;x.fillStyle=alpha(COL.gold,.25);
        x.beginPath();x.roundRect(-p.size,-p.size*.7,p.size*2,p.size*1.4,3);x.fill();x.stroke();x.shadowBlur=0;x.restore();break;}
      case 'bolt':{if(!p.a2)break;x.strokeStyle=p.col;x.lineWidth=p.size;x.shadowColor=p.col;x.shadowBlur=14;x.beginPath();x.moveTo(p.x,p.y);

    <div class="hp l"><small><span id="bhn"></span><span id="bhv"></span></small><div class="bar"><i id="bhb"></i></div></div>
    <div class="hp r"><small><span id="bbn"></span><span id="bbv"></span></small><div class="segs" id="bbs"></div></div>
    <div class="combo" id="bcombo"></div>
    <div class="side hero" id="bhero"><div class="aura"></div><div class="avatar" id="bhav"><span>✦</span></div><div class="name" id="bhname"></div></div>
    <div class="side boss" id="bboss"><div class="baura"></div><div class="avatar" id="bbav"></div><div class="name" id="bbname"></div></div>
    <div id="bfx"></div><div class="beam" id="bbeam"></div>
    <div class="cut" id="bcut"><div class="eyes"><i></i><i></i></div><span id="bcutt"></span></div>
    <div class="gauge"><small id="bgl"></small><div class="bar"><i id="bgb"></i></div></div></div>`;
}
function restart(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function fxEl(cls,style,ms){const e=document.createElement('div');e.className=cls;Object.assign(e.style,style||{});$('bfx').appendChild(e);setTimeout(()=>e.remove(),ms||1200);return e;}
function renderBattle(sc,prev,fxNew){
  if(!$('bt'))btBuild();
  $('bhn').textContent=sc.hero;$('bhv').textContent=`${U('bt_hp')} ${sc.hero_hp}/${sc.hero_max}`;$('bhb').style.width=pct(sc.hero_hp,sc.hero_max);
  $('bbn').textContent=sc.boss;$('bbv').textContent=sc.ko?'K.O.':`${sc.boss_hp}/${sc.boss_max}`;
  const segs=Array.from({length:sc.bars},(_,i)=>i<sc.bars_broken||sc.ko?0:i===sc.bars_broken?sc.boss_hp/sc.boss_max*100:100);
  if($('bbs').children.length!==sc.bars)$('bbs').innerHTML=segs.map(()=>'<div class="bar host"><i></i></div>').join('');
  [...$('bbs').children].forEach((b,i)=>b.firstChild.style.width=segs[i]+'%');
  $('bcombo').textContent=sc.combo>1?`${sc.combo} ${U('bt_combo')}!`:'';if(fxNew&&sc.combo>1)restart($('bcombo'),'bump');
  $('bhname').textContent=sc.hero;$('bbname').textContent=sc.boss;
  const boss=$('bboss');boss.classList.toggle('f2',sc.bars_broken===1);boss.classList.toggle('f3',sc.bars_broken>=2&&!sc.ko);boss.classList.toggle('ko',!!sc.ko);
  $('bgl').textContent=U('bt_power');$('bgb').style.width=pct(sc.power,1);$('bt').style.setProperty('--pw',sc.power);
  if(!fxNew)return;
  const hero=$('bhero'),hp=relPos($('bhav')),bp=relPos($('bbav'));
  if(sc.cutin){const c=$('bcut');c.className='cut '+sc.cutin.who;$('bcutt').textContent=sc.cutin.text;restart(c,'go');}
  const pop=(who,n,crit)=>{const p=who==='boss'?bp:hp;emit({kind:'text',text:`−${n}`,x:p.x+rnd(-20,20),y:p.y-p.h*.55,vy:-90,g:140,life:1.3,size:crit?62:44,
      col:crit?COL.gold:'#ffffff',stroke:who==='boss'?COL.host:COL.ink,pop:1});
    if(crit)emit({kind:'text',text:'CRITICAL!',x:p.x,y:p.y-p.h*.95,vy:-40,life:1.2,size:24,col:COL.edge,pop:1});};
  switch(sc.fx){
    case 'transform':flash(.8);restart(hero,'transform');fxEl('pillar',{left:`${hp.x}px`},1600);
      later(250,()=>{ring(hp.x,hp.y,COL.decker,240,1,6,20);burst(hp.x,hp.y,50,{kind:'spark',col:COL.decker,speed:420,life:.8,size:3,glow:12});burst(hp.x,hp.y,30,{kind:'dot',col:COL.gold,speed:250,life:1.3,size:3,glow:10,g:-60});});break;
    case 'appear':restart(boss,'enter');later(450,()=>{shake(14,600);ring(bp.x,bp.y+bp.h*.4,COL.host,300,1,6,20);burst(bp.x,bp.y+bp.h*.4,40,{kind:'dot',col:'rgba(40,10,30,.9)',speed:300,life:1.2,size:7,drag:1.6});});break;
    case 'attack':{hero.style.setProperty('--dx',`${bp.x-hp.x-bp.w*.55}px`);restart(hero,'dash');
      for(let k=1;k<=3;k++)later(k*45,()=>fxEl('ghost',{left:`${hp.x-hp.w/2+(bp.x-hp.x)*.25*k}px`,top:`${hp.y-hp.h/2}px`,width:`${hp.w}px`,height:`${hp.h}px`},500));
      later(230,()=>{fxEl('slash',{left:`${bp.x}px`,top:`${bp.y}px`,transform:`translate(-50%,-50%) rotate(${rnd(-40,40)}deg)`},600);restart(boss,'hurt');
        burst(bp.x,bp.y,30,{kind:'spark',col:'#ffffff',speed:460,life:.4,size:3,glow:10});burst(bp.x,bp.y,16,{kind:'spark',col:COL.decker,speed:300,life:.5,size:2,glow:10});
        if(sc.dmg)pop('boss',sc.dmg.n,sc.dmg.crit);if(sc.dmg&&sc.dmg.crit){flash(.35);shake(10,400);}else shake(5,250);});break;}
    case 'hit':case 'dodge':{const o=fxEl('orbshot',{left:`${bp.x}px`,top:`${bp.y}px`},700);o.style.setProperty('--dx',`${hp.x-bp.x}px`);o.style.setProperty('--dy',`${hp.y-bp.y}px`);restart(boss,'cast');
      later(380,()=>{if(sc.fx==='hit'){restart(hero,'hurt');tint(COL.host,.3);shake(9,380);burst(hp.x,hp.y,26,{kind:'dot',col:'#8a2be2',speed:260,life:.7,size:4,glow:10});if(sc.dmg)pop('hero',sc.dmg.n,false);}
        else{restart(hero,'dodge');fxEl('ghost',{left:`${hp.x-hp.w/2}px`,top:`${hp.y-hp.h/2}px`,width:`${hp.w}px`,height:`${hp.h}px`},600);
          emit({kind:'text',text:'Nachbild!',x:hp.x,y:hp.y-hp.h*.7,vy:-40,life:1.1,size:22,col:COL.decker,pop:1});}});break;}
    case 'form':restart(boss,'powerup');later(200,()=>{flash(.45);shake(16,700);[0,150,300].forEach(d=>later(d,()=>ring(bp.x,bp.y,COL.host,260,1,6,30)));
      burst(bp.x,bp.y,50,{kind:'spark',col:COL.host,speed:420,life:.7,size:3,glow:12});});break;
    case 'power':{const W=$('gstage').clientWidth,H=$('gstage').clientHeight;(sc.sparks||[]).forEach((n,i)=>later(i*90,()=>{
        const side=i%4,sx=side===0?-30:side===1?W+30:rnd(0,W),sy=side<2?rnd(0,H):side===2?-20:H+20;
        emit({kind:'text',text:n,x:sx,y:sy,vx:(hp.x-sx)/1,vy:(hp.y-sy)/1,life:1,size:18,col:COL.gold,stroke:COL.ink,fadePow:8});
        later(950,()=>{burst(hp.x,hp.y,8,{kind:'dot',col:COL.gold,speed:160,life:.6,size:2.5,glow:10});});}));
      ring(hp.x,hp.y,COL.gold,160,1,4,30);break;}
    case 'ult':flash(.95);later(450,()=>{const bm=$('bbeam');bm.style.left=`${hp.x}px`;bm.style.top=`${hp.y}px`;bm.style.width=`${bp.x-hp.x}px`;restart(bm,'go');
      for(let k=0;k<14;k++)later(k*70,()=>{burst(bp.x,bp.y,8,{kind:'spark',col:k%2?COL.gold:'#ffffff',speed:500,life:.4,size:3,glow:12});shake(8,200);});
      ring(bp.x,bp.y,COL.gold,260,1,8,30);});break;
    case 'ko':flash(.9);shake(20,900);fxEl('kotext',{},2600).textContent='K.O.!';
      [0,120,260,420].forEach((d,k)=>later(d,()=>ring(bp.x,bp.y,[COL.gold,COL.host,'#ffffff',COL.edge][k],340,1.2,8,30)));
      burst(bp.x,bp.y,70,{kind:'spark',col:COL.gold,speed:600,life:1,size:3.5,glow:14,drag:1});burst(bp.x,bp.y,40,{kind:'square',col:'#2a0b1e',speed:420,g:300,life:1.5,size:9});
      burst(bp.x,bp.y,40,{kind:'dot',col:COL.host,speed:340,life:1.3,size:4,glow:10,drag:1});break;
  }
}
function battleFrame(sc,dt){
  const a=$('bhav'),b=$('bbav');if(!a||!b)return;
  if(Math.random()<dt*(6+sc.power*30)){const p=relPos(a);emit({kind:'dot',x:p.x+rnd(-p.w*.4,p.w*.4),y:p.y+p.h*.3,vx:rnd(-10,10),vy:rnd(-90,-40),life:rnd(.6,1.1),size:rnd(1.5,3),col:sc.power>.5?COL.gold:COL.decker,glow:8,shrink:1});}
  if(!sc.ko&&Math.random()<dt*10){const p=relPos(b);emit({kind:'dot',x:p.x+rnd(-p.w*.45,p.w*.45),y:p.y+p.h*.35,vx:rnd(-10,10),vy:rnd(-70,-30),life:rnd(.7,1.3),size:rnd(2,5),col:'rgba(60,10,45,.85)',shrink:1});}
}

// ---------------- Gemeinsames: Werte, Liste, Bildschleife ----------------
function gStats(run,sc){
  const row=(label,val,bar)=>`<div class="row"><h3>${esc(label)} <b>${esc(val)}</b></h3>${bar||''}</div>`;
  const bar=(a,b,cls)=>`<div class="bar ${cls||''}"><i style="width:${pct(a,b)}"></i></div>`;
  if(run.game==='datasite'){
    let h=row(`${U('ds_virus')} · ${U('ds_coh')}`,`${sc.coh} / ${sc.coh_max}`,bar(sc.coh,sc.coh_max,sc.coh<=sc.coh_max/4?'host':''));
    h+=`<div class="statline"><span>${esc(U('ds_str'))}</span><b>${sc.str}</b></div>`;
    const chips=[sc.shield?`${U('ds_shield')} ×${sc.shield}`:'',sc.dot?`${U('ds_dot')} ×${sc.dot}`:''].filter(Boolean);
    if(chips.length)h+=`<div class="chips">${chips.map(c=>`<span class="on">${esc(c)}</span>`).join('')}</div>`;
    h+=`<div class="row"><h3>${esc(U('ds_slots'))}</h3><div class="slots">${[0,1,2].map(i=>sc.slots[i]?`<span class="on">${esc(sc.slots[i])}</span>`:'<span>–</span>').join('')}</div></div>`;
    const t=sc.target!=null?sc.nodes[sc.target]:null;
    if(t&&t.coh_max)h+=row(`${U('ds_target')}: ${t.name}`,`${Math.max(0,t.coh)}/${t.coh_max} · ${U('ds_str')} ${t.str}`,bar(t.coh,t.coh_max,'host'));
    return h;
  }
  if(run.game==='treasure'){
    const taken=sc.clues.filter(c=>c.taken).length;
    let h=`<div class="row"><h3>${esc(U('tr_clues'))} <b>${taken} / 3</b></h3><div class="chips">${sc.clues.map(c=>`<span class="${c.taken?'on':'off'}">📜</span>`).join('')}</div></div>`;
    h+=`<div class="row"><h3>${esc(U('tr_heat'))} <b>${esc(sc.heat_text||'–')}</b></h3><div class="bar heat"><i></i><b style="left:calc(${pct(sc.heat,1)} - 2px)"></b></div></div>`;
    h+=row(U('tr_stamina'),`${sc.stamina} / ${sc.stamina_max}`,bar(sc.stamina,sc.stamina_max,'gold'));
    return h;
  }
  if(run.game==='riddle'){
    let h=row(U('rd_hp'),`${sc.hp} / ${sc.hp_max}`,bar(sc.hp,sc.hp_max,'host'));
    h+=`<div class="row"><h3>${esc(U('rd_seals'))} <b>${sc.seals} / 3</b></h3><div class="chips">${[U('rd_riddle'),U('rd_runes'),U('rd_braziers')].map((n,i)=>`<span class="${i<sc.seals?'on':''}">${i<sc.seals?'✓ ':''}${esc(n)}</span>`).join('')}</div></div>`;
    return h;
  }
  if(run.game==='battle'){
    let h=row(U('bt_hp'),`${sc.hero_hp} / ${sc.hero_max}`,bar(sc.hero_hp,sc.hero_max));
    h+=row(sc.boss,sc.ko?'K.O.':`${Math.min(3,sc.bars_broken+1)} / ${sc.bars}`,bar(sc.ko?0:(sc.bars-sc.bars_broken-1)*sc.boss_max+sc.boss_hp,sc.bars*sc.boss_max,'host'));
    h+=row(U('bt_power'),`${Math.round(sc.power*100)} %`,bar(sc.power,1,'gold'));
    return h;
  }
  return '';
}
// Teilnehmerliste: einmal aufbauen, danach nur Zustände wechseln (für Übergänge)
function renderCands(run){
  const key=run.candidates.map(c=>c.name).join('|');const tray=$('gtray');
  if(GS.candKey!==key||!$('gcands')){GS.candKey=key;const icon={datasite:'▣',treasure:'📜',battle:'✦'}[run.game]||'';
    let cs=run.candidates.map((c,i)=>({...c,i}));const vals=cs.some(c=>c.value!=null);if(vals)cs.sort((a,b)=>(b.value||0)-(a.value||0));
    tray.innerHTML=`<div class="action"><h2>${esc(U('register'))}</h2></div><div class="gcands g-${esc(run.game)}" id="gcands">${cs.map((c,k)=>
      `<span class="gc" id="gc${c.i}" style="--rot:${((c.i*37)%11)-5}deg;animation-delay:${k*.05}s">${icon?`<i>${icon}</i>`:''}${c.value!=null?`<em data-v="${c.value}">?</em>`:''}<span>${esc(c.name)}</span></span>`).join('')}</div>`;
    if(vals)tray.querySelectorAll('em[data-v]').forEach((el,k)=>{const v=+el.dataset.v,end=now()+500+k*70;const t=setInterval(()=>{if(!el.isConnected){clearInterval(t);return;}
      if(now()>=end){el.textContent=v;el.classList.add('done');clearInterval(t);}else el.textContent=1+Math.floor(Math.random()*100);},55);});}
  run.candidates.forEach((c,i)=>{const el=$('gc'+i);if(el&&!el.classList.contains(c.state)){el.classList.remove('offen','raus','gewinner');el.classList.add(c.state);}});
}
function renderGame(run){
  const sc=run.scene||{};
  if(GS.game!==run.game||(GS.fxId>=0&&sc.fx_id<GS.fxId)){resetGS(run.game);$('gdom').innerHTML='';$('gtray').innerHTML='';}
  const fxNew=sc.fx_id!==GS.fxId,prev=GS.prev;
  $('ghost').textContent=run.host;
  $('gmeta').textContent=run.game==='datasite'?(sc.analyzer||''):'';
  $('gphase').innerHTML=`<em>${esc(run.phase)}</em>${esc(run.phase_text)}`;
  $('gdecker').textContent=run.decker;
  $('gsub').textContent=run.game==='datasite'?(sc.ship||''):run.game==='treasure'?(sc.tool||''):'';
  $('gstat').innerHTML=gStats(run,sc);
  $('glog').innerHTML=run.log.slice(-14).map(l=>`<p class="${esc(l.tone)}">${esc(l.text)}</p>`).join('');
  if(run.candidates&&run.candidates.length)renderCands(run);
  else{GS.candKey='';const threat=['fight','core','appear','event'].includes(run.phase_key);const t=run.phase_text||'';
    const a=$('gtray').querySelector('.announce');if(!a||a.dataset.t!==t||a.classList.contains('threat')!==threat){
      $('gtray').innerHTML=`<div class="announce gin${threat?' threat':''}" data-t="${esc(t)}">${esc(t)}</div>`;}}
  if(run.game==='riddle')renderRiddle(sc,prev,fxNew);
  else if(run.game==='battle')renderBattle(sc,prev,fxNew);
  else if($('gdom').firstChild)$('gdom').innerHTML='';
  if(fxNew){if(run.game==='datasite')dsFx(sc,prev);if(run.game==='treasure')trFx(sc,prev);GS.fxId=sc.fx_id;GS.prev=sc;}
}
function gameFrame(run){
  const sc=run.scene;if(!sc)return;const T=now(),dt=Math.min(.05,Math.max(0,(T-GS.lastT)/1000));GS.lastT=T;
  const B=prepCanvas($('gcanvas')),F=prepCanvas($('gfx'));if(B.w<10||B.h<10)return;
  let sx=0,sy=0;if(T<GS.shakeT){const a=GS.shakeA*(GS.shakeT-T)/GS.shakeD;sx=Math.sin(T/16)*a;sy=Math.cos(T/21)*a*.7;}else GS.shakeA=0;
  $('gdom').style.transform=sx||sy?`translate(${sx}px,${sy}px)`:'';
  B.x.translate(sx,sy);F.x.translate(sx,sy);
  ambient(run,B.x,B.w,B.h,T,dt);
  if(run.game==='datasite')dsDraw(B.x,B.w,B.h,sc,T,dt);
  else if(run.game==='treasure')trDraw(B.x,B.w,B.h,sc,T,dt,run);
  else if(run.game==='riddle')riddleFrame(dt);
  else if(run.game==='battle')battleFrame(sc,dt);
  drawParts(F.x,dt);
  F.x.setTransform(F.dpr,0,0,F.dpr,0,0);
  if(GS.tint&&GS.tint.a>0){const g=F.x.createRadialGradient(F.w/2,F.h/2,Math.min(F.w,F.h)*.25,F.w/2,F.h/2,Math.max(F.w,F.h)*.75);
    g.addColorStop(0,alpha(GS.tint.col,0));g.addColorStop(1,alpha(GS.tint.col,GS.tint.a*1.6));F.x.fillStyle=g;F.x.fillRect(0,0,F.w,F.h);GS.tint.a-=dt*.7;}
  if(GS.flash>0){F.x.fillStyle=`rgba(255,255,255,${Math.min(1,GS.flash)})`;F.x.fillRect(0,0,F.w,F.h);GS.flash=Math.max(0,GS.flash-dt*2.4);}
}

// ---------- Gesamt-Render ----------
function apply(st){
  S=st;
  if(!demo&&st.theme!==undefined)ensureTheme(st.theme,st.theme_v);
  document.body.dataset.visible=st.visible?'1':'0';
  $('idle').hidden=!!st.visible||demo;
  const isRun=!!st.run&&(st.mode==='run'||st.mode==='winner');
  $('open').hidden=isRun||st.mode!=='open';
  const isGame=isRun&&st.run.game&&st.run.game!=='dice';
  $('run').hidden=!isRun||isGame;
  $('game').hidden=!isGame;
  if(st.mode==='open'){
    $('call').innerHTML=esc(U('open_call')).split('{kw}').join(`<kbd>${esc(st.keyword||'!join')}</kbd>`);
    $('cnt').textContent=st.count||0;
    const sec=Math.max(0,Math.ceil(st.timer_remaining||0));
    $('clock').innerHTML=st.timer_active?`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}<small>${esc(U('open_until'))}</small>`:`<small>${esc(U('open_manual'))}</small>`;
    $('clock').classList.toggle('urgent',st.timer_active&&sec<=10);
    $('joined').innerHTML=(st.recent||[]).map(n=>`<span>${esc(n)}</span>`).join('');
    const n=st.winners_count||1;
    let html='';
    const wn=esc(U('winners',{n}));
    if(st.prize)html+=`<span>${esc(U('prize'))}</span>${esc(st.prize)}`;
    if(n>1)html+=st.prize?`<em>${wn}</em>`:wn;
    $('prize').hidden=!html;$('prize').innerHTML=html;
  }
  if(isGame){renderGame(st.run);kick();}
  else if(isRun){renderRun(st.run);kick();}
  const ws=(st.mode==='winner'&&st.winners)||[];
  const wn=ws.length>0;
  $('winner').hidden=!wn;
  if(wn){
    const multi=ws.length>1;
    $('winner').classList.toggle('multi',multi);
    $('winner').querySelector('small').textContent=multi?U('winner_many',{n:ws.length}):U('winner_one');
    const tick=ev=>[ev.corp?`[${ev.corp}]`:'',ev.alliance?`<${ev.alliance}>`:''].filter(Boolean).join(' ');
    const prizeHtml=p=>p?`${p.icon?`<img src="${esc(p.icon)}" alt="" onerror="this.remove()">`:''}${esc(p.label)}`:'';
    $('wlist').hidden=!multi;$('wmore').hidden=true;
    $('wname').hidden=multi;$('weve').hidden=true;$('wprize').hidden=true;$('wnote').hidden=multi;
    if(multi){
      $('wpic').hidden=true;$('winner').classList.remove('has-pic');
      const max=12;
      $('wlist').innerHTML=ws.slice(0,max).map((w,i)=>{
        const ev=w.eve;const pic=ev&&ev.portrait;
        return `<div class="wcard">${pic?`<img class="ph" src="${esc(pic)}" alt="" onerror="this.outerHTML='<div class=&quot;ph none&quot;>${i+1}</div>'">`:`<div class="ph none">${i+1}</div>`}
          <b>@${esc(w.login)}</b>${ev?`<span class="ev">${esc(ev.name)} ${esc(tick(ev))}</span>`:''}
          ${w.prize?`<span class="pz">${prizeHtml(w.prize)}</span>`:`<span class="no">${esc(U('winner_n',{n:i+1}))}</span>`}</div>`;}).join('');
      if(ws.length>max){$('wmore').hidden=false;$('wmore').textContent=U('more',{n:ws.length-max});}
    }else{
      const w=ws[0],ev=w.eve;
      $('wname').textContent='@'+w.login;
      $('weve').hidden=!ev;
      if(ev){const t=tick(ev);$('weve').innerHTML=`${esc(ev.name)}${t?`<span>${esc(t)}</span>`:''}`;}
      $('wprize').hidden=!w.prize;$('wprize').innerHTML=prizeHtml(w.prize);
      const pic=ev&&ev.portrait;
      if(pic&&$('wimg').getAttribute('src')!==pic){$('wimg').src=pic;}
      $('wpic').hidden=!pic;$('winner').classList.toggle('has-pic',!!pic);
      $('wnote').textContent=st.run&&st.run.converged?U('converged_note'):U('winner_note',{count:st.count,os:st.run?st.run.os:0,max:st.run?st.run.os_max:40});
    }
    const key=ws.map(w=>w.login).join(',');
    if(lastWinner!==key){lastWinner=key;$('winner').classList.remove('show');void $('winner').offsetWidth;$('winner').classList.add('show');}
  }else lastWinner='';
}

// ---------- Live / Demo ----------
let retry=500;
function connect(){
  const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{retry=500;$('idle').className='idle';$('idle').textContent=U('conn_idle');};
  ws.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(err){console.error(err)}};
  ws.onclose=()=>{$('idle').className='idle off';$('idle').textContent=U('conn_off')||'Keine Verbindung zum Giveaway-Tool';
    apply({visible:false,mode:'idle'});setTimeout(connect,retry);retry=Math.min(10000,retry*1.7);};
}
async function runDemo(){
  $('demo').hidden=false;
  for(;;){
    let data;try{data=await (await fetch('/api/demo'+location.search)).json();}catch(e){await new Promise(r=>setTimeout(r,2000));continue;}
    const names=data.participants;
    // Teilnahmephase: 6 Sekunden mit eintreffenden Personas
    for(let i=0;i<=12;i++){const shown=names.slice(0,Math.min(names.length,Math.floor(i*names.length/12)));
      apply({visible:true,mode:'open',keyword:'!hack',count:shown.length,recent:shown.slice().reverse().slice(0,10),timer_active:true,timer_remaining:6-i*.5,prize:data.prize,winners_count:data.winners.length});
      await new Promise(r=>setTimeout(r,500));}
    const t0=performance.now();let idx=0;
    while(idx<data.frames.length){
      const el=(performance.now()-t0)/1000;
      while(idx<data.frames.length&&data.frames[idx].t<=el){
        const f=data.frames[idx];idx++;
        apply({visible:true,mode:f.view.done?'winner':'run',run:f.view,winners:f.view.done?data.winners:[],count:names.length});
      }
      await new Promise(r=>setTimeout(r,50));
    }
    await new Promise(r=>setTimeout(r,6000));
    apply({visible:false,mode:'idle'});await new Promise(r=>setTimeout(r,1500));
  }
}
addEventListener('resize',kick);
readColors();
if(demo)ensureTheme(q.get('theme')||'',Date.now()).then(runDemo);else{ensureTheme('',0);connect();}
</script>
